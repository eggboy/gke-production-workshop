# Secret Manager add-on demo (rendered with envsubst for ${PROJECT_ID} and ${PREFIX}).
# A Kubernetes ServiceAccount (KSA) is granted access to ONE secret in Secret Manager through
# Workload Identity Federation for GKE - no Google service account keys, no Kubernetes Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: secrets-demo
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: db-credentials
  namespace: secrets-demo
spec:
  provider: gke                       # the managed Secret Manager add-on
  parameters:
    secrets: |
      - resourceName: "projects/${PROJECT_ID}/secrets/${PREFIX}-db-password/versions/latest"
        path: "db-password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-reader
  namespace: secrets-demo
  labels:
    app: secret-reader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-reader
  template:
    metadata:
      labels:
        app: secret-reader
    spec:
      serviceAccountName: secret-reader
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"   # Standard clusters: run on Workload Identity nodes
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ${AR_PATH}/busybox:1.38.0
        # Prints a fingerprint (not the value!) of the mounted secret every 30 seconds, so you can watch rotation.
        command: ["/bin/sh", "-c"]
        args:
        - while true; do echo "$(date -u +%H:%M:%S) db-password sha256=$(sha256sum /var/secrets/db-password | cut -c1-12)"; sleep 30; done
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
        volumeMounts:
        - name: secrets
          mountPath: /var/secrets
          readOnly: true
      volumes:
      - name: secrets
        csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: db-credentials
