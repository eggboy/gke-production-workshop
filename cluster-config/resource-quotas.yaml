# ResourceQuotas cap what each team can consume and block unwanted Service types.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: onlineboutique-quota
  namespace: onlineboutique
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 8Gi
    limits.cpu: "12"
    limits.memory: 16Gi
    pods: "60"
    services.loadbalancers: "0"   # Apps are published only through the shared Gateway (no L4 public IPs)
    services.nodeports: "0"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: secrets-demo-quota
  namespace: secrets-demo
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
    services.loadbalancers: "0"
    services.nodeports: "0"
