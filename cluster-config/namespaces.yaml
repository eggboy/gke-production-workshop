# Namespaces with Pod Security Admission (PSA) labels.
#   enforce: violating Pods are rejected
#   warn:    the client sees a warning
#   audit:   the violation is recorded in the audit log
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-infra            # Platform team: shared Gateway (load balancer) configuration
  labels:
    team: platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: onlineboutique           # Production application
  labels:
    team: shop
    gateway-access: "true"       # Allowed to attach HTTPRoutes to the shared Gateway's HTTPS listener
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: secrets-demo             # Secret Manager + Workload Identity lab
  labels:
    team: security
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev                      # Sandbox for tests; baseline is enforced, restricted only warns
  labels:
    team: dev
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
