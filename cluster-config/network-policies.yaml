# Workloads that use Workload Identity Federation must reach the GKE metadata server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metadata-server-egress
  namespace: secrets-demo
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
  - to:
    - ipBlock:
        cidr: 169.254.169.254/32
    ports:
    - {protocol: TCP, port: 80}
    - {protocol: TCP, port: 8080}
  - to:
    - ipBlock:
        cidr: 169.254.169.252/32
    ports:
    - {protocol: TCP, port: 987}
    - {protocol: TCP, port: 988}
