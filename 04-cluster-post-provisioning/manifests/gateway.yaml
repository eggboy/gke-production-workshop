# Shared Gateway owned by the platform team (rendered with envsubst for ${GATEWAY_IP_NAME} and ${SSL_POLICY}).
# GatewayClass gke-l7-global-external-managed = global external Application Load Balancer.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-gateway
  namespace: gateway-infra
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
  - type: NamedAddress
    value: ${GATEWAY_IP_NAME}          # Global static IP reserved in Lab 02
  listeners:
  - name: http                         # Port 80: only the HTTP-to-HTTPS redirect route (same namespace)
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  - name: https                        # Port 443: application routes from approved namespaces
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: shop-tls                 # Self-signed certificate created in this lab
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            gateway-access: "true"
---
# Enforce TLS 1.2+ with a MODERN cipher profile on the load balancer.
apiVersion: networking.gke.io/v1
kind: GCPGatewayPolicy
metadata:
  name: external-gateway-policy
  namespace: gateway-infra
spec:
  default:
    sslPolicy: ${SSL_POLICY}
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: external-gateway
---
# Redirect every plain-HTTP request to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: gateway-infra
spec:
  parentRefs:
  - name: external-gateway
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
